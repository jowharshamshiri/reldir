name: Release

# A tag `vX.Y.Z` releases version X.Y.Z on GitHub: the reldir binary for each
# platform, archived, with its SHA-256 checksum beside it. `reldir self update`
# installs from these assets, so their names are part of its contract:
# `reldir-vX.Y.Z-<target>.tar.gz` and `<archive>.sha256`, for every target.
#
# The version is wsb's, rendered into version.txt and Cargo.toml by the
# pre-commit hook; the tag must name the version of the commit it tags. Tag
# only a commit CI has passed.
#
# The release is made as a draft and published once every binary is attached,
# so no reader ever sees a latest release that is missing its platform.
# Publishing to crates.io, PyPI and npm is a separate, manual workflow
# (publish.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag is the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not name the commit's version $version (version.txt)" >&2
            exit 1
          fi
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml says $cargo_version but version.txt says $version: render Cargo.toml.wstemplate" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  draft:
    name: draft release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: create the draft, with the changelog's section when it has one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { keep = 1; next }
            keep && /^## \[/ { exit }
            keep { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "reldir $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "reldir $VERSION" --generate-notes
          fi

  binaries:
    name: binary (${{ matrix.target }})
    needs: [version, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          bin: reldir
          package: reldir
          target: ${{ matrix.target }}
          locked: true
          archive: reldir-$tag-$target
          # A .tar.gz on every platform, which `reldir self update` unpacks;
          # Windows also gets the .zip its users expect.
          tar: all
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: the binary runs and is the tagged version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          said=$("target/${{ matrix.target }}/release/reldir$ext" --version)
          echo "$said"
          [ "$said" = "reldir $VERSION" ]

  publish:
    name: publish release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: every platform is attached, with its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            for name in "reldir-$GITHUB_REF_NAME-$target.tar.gz" "reldir-$GITHUB_REF_NAME-$target.tar.gz.sha256"; do
              grep -qxF "$name" <<< "$assets" || { echo "missing $name" >&2; missing=1; }
            done
          done
          exit $missing
      - name: publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
