[package]
name = "reldir-py"
description = "Python bindings for reldir: the engine in-process, behind a DB-API 2.0 interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

[lib]
name = "_reldir"
crate-type = ["cdylib"]
# Tested from its own language (pytest, node --test): a Rust test harness
# would need the interpreter's symbols at link time.
test = false
doctest = false

[features]
# Set by maturin when it builds the extension module: the interpreter that
# loads it provides Python's symbols.
extension-module = ["pyo3/extension-module"]

[dependencies]
reldir-core.workspace = true
reldir = { path = "../reldir" }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde_json.workspace = true
