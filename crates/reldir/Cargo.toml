[package]
name = "reldir"
description = "A filesystem-native relational JSON database: the reldir command, shell and MCP server"
readme = "../../README.md"
categories = ["command-line-utilities", "database-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true

[lib]
name = "reldir"
path = "src/lib.rs"

[[bin]]
name = "reldir"
path = "src/main.rs"

# `cargo binstall reldir` installs the binary a release built for the target.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/reldir-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = ["parquet", "self-update"]
# Writing Parquet, by `export`.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
# `reldir self update`: replace this binary with a GitHub release's. Off where
# the binary is not reldir's own -- the Python package runs `main` in Python.
self-update = ["dep:ureq", "dep:rustls", "dep:flate2", "dep:tar", "dep:self-replace", "dep:sha2", "dep:hex"]

[dependencies]
reldir-core.workspace = true
arrow-array = { version = "60.0.0", optional = true }
arrow-schema = { version = "60.0.0", optional = true }
parquet = { version = "60.0.0", optional = true, default-features = false, features = ["arrow", "snap"] }
notify = "8.2.0"
flate2 = { version = "1.1", optional = true }
hex = { workspace = true, optional = true }
# The ring provider: aws-lc-rs would need cmake and nasm to build on Windows.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
self-replace = { version = "1.5", optional = true }
sha2 = { workspace = true, optional = true }
tar = { version = "0.4", optional = true, default-features = false }
# Certificates from the operating system's store, not a bundled copy.
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
tempfile.workspace = true
ulid.workspace = true
clap.workspace = true
clap_complete.workspace = true
csv.workspace = true
jsonschema.workspace = true
rmcp.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
flate2 = "1.1"
hex.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
arrow-array = "60.0.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
assert_cmd.workspace = true
predicates.workspace = true
proptest.workspace = true
regex.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "macros", "process", "time"] }
