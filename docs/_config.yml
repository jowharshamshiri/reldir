# GitHub Pages configuration.
#
# Pages is configured to serve the /docs folder on the default branch.

title: reldir
description: A relational database that lives in a directory of JSON files.
theme: jekyll-theme-primer

# Pages serves this as a project site under /reldir/, and `permalink: pretty`
# gives every page a directory URL (/reldir/cli/). A bare relative link like
# [CLI reference](cli) therefore resolves against that directory and 404s at
# /reldir/getting-started/cli. Declaring the base path lets every cross-link be
# written {{ site.baseurl }}/cli, which is correct from any page.
url: https://jowharshamshiri.github.io
baseurl: /reldir
permalink: pretty
