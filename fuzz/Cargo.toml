[package]
name = "reldir-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reldir-core = { path = "../crates/reldir-core", features = ["testing"] }

[workspace]
members = ["."]

[[bin]]
name = "json_and_locator"
path = "fuzz_targets/json_and_locator.rs"
test = false
doc = false
bench = false

