test = false
doc = false
bench = false

[[bin]]
name = "sql_front_end"
path = "fuzz_targets/sql_front_end.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_name"
path = "fuzz_targets/file_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_edit"
path = "fuzz_targets/json_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge"
path = "fuzz_targets/merge.rs"
test = false
doc = false
