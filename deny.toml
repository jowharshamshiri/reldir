# cargo-deny: what may enter the dependency graph.

[graph]
all-features = true

[advisories]
# Every advisory fails the check, unmaintained and unsound included; one that
# is judged not to apply is ignored here by id, with the reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only: reldir is MIT and must stay distributable as such.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # notify (the folder monitor's watcher) is dedicated to the public domain.
    "CC0-1.0",
    # inotify, notify's Linux backend: ISC is MIT's equivalent.
    "ISC",
    "BSD-2-Clause",
    # snap, parquet's Snappy codec: BSD-3 adds only a no-endorsement clause.
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The Mozilla root certificates, as data. rustls-platform-verifier links them
# only on wasm32, which reldir is never built for; every release target uses
# the operating system's store.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency without a version is a wildcard; it is allowed only in a
# crate that is never published (the Python and Node bindings, the harnesses).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
