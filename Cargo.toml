[workspace]
resolver = "3"
members = ["crates/reldir-core", "crates/reldir", "crates/reldir-py", "crates/reldir-node", "xtask", "bowtie"]
# The Python and Node extensions are built by maturin and napi, which link
# them against the runtime that loads them; plain cargo commands build the
# engine and the CLI.
default-members = ["crates/reldir-core", "crates/reldir"]

[workspace.package]
version = "0.107.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/jowharshamshiri/reldir"
homepage = "https://jowharshamshiri.github.io/reldir/"
documentation = "https://jowharshamshiri.github.io/reldir/"
keywords = ["database", "json", "sql", "filesystem", "schema"]

[workspace.dependencies]
reldir-core = { path = "crates/reldir-core", version = "=0.107.0" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
csv = "1.3"
globset = "0.4"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.49.9", default-features = false, features = ["arbitrary-precision"] }
libc = "0.2"
regex = "1"
rmcp = { version = "3.5", features = ["server", "transport-io", "macros", "elicitation"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "hooks", "collation", "column_decltype", "functions", "vtab"] }
rustyline = "17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order", "unbounded_depth", "arbitrary_precision"] }
sha2 = "0.10"
sqlparser = { version = "0.58", features = ["visitor"] }
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "io-std", "macros"] }
ulid = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }
assert_cmd = "2"
predicates = "3"
proptest = "1.11"

[profile.release]
debug = "line-tables-only"
